[project]
name = "fjallstation"
version = "0.1.2"
description = "A data and RL environment API for LLM training in the built environment."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Zeng Peng" }]
keywords = ["llm", "agents", "reinforcement-learning", "modelica", "hvac", "building-energy"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]
dependencies = ["datasets>=4.0", "numpy", "pyarrow"]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
fjallstation = "fjallstation.__main__:main"

[project.urls]
Repository = "https://github.com/zengpz/fjallstation"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fjallstation"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
